<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-label="Pad to native cursor menu bar template">
  <!-- macOS template image: pure black on transparent, isTemplate = true.
       AppKit inverts it for dark menu bars.

       Drawn to fill the canvas. An earlier version kept the app icon's
       proportions — thin stroke, glyph spanning only the middle half of
       the box — and read as visibly smaller than neighbouring menu-bar
       icons, which are dense filled marks. This version uses a heavier
       stroke, spans ~93% of the width and ~83% of the height, and
       overlaps the pointer onto the pad with a knocked-out gap so the
       two shapes stay legible where they meet. -->
  <defs>
    <mask id="pointerGap">
      <rect width="18" height="18" fill="white"/>
      <!-- The pointer, dilated by a fat stroke, punches the gap. -->
      <path transform="translate(8.9,5.2) scale(0.6)"
            d="M0 0 L0 17.6 L4.6 13.2 L7.5 19.2 L10.6 17.8 L7.7 11.9 L13.6 11.7 Z"
            fill="black" stroke="black" stroke-width="3.0" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect x="1.2" y="2.6" width="11.6" height="9.0" rx="2.2"
        fill="none" stroke="#000000" stroke-width="1.8" mask="url(#pointerGap)"/>

  <path transform="translate(8.9,5.2) scale(0.6)"
        d="M0 0 L0 17.6 L4.6 13.2 L7.5 19.2 L10.6 17.8 L7.7 11.9 L13.6 11.7 Z"
        fill="#000000"/>
</svg>
